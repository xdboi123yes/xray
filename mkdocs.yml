site_name: Chest X-Ray Tiered Classification — Technical Docs
site_description: >-
  Architecture and reproducibility documentation for the tiered, uncertainty-aware
  pneumothorax detection thesis project (NIH ChestX-ray14, zero-shot CheXpert).
docs_dir: docs
theme:
  name: readthedocs
nav:
  - Home: index.md
  - Architecture: architecture.md
  - Ablation Studies (A1-A15): ablations.md
  - Reproducibility: reproducibility.md
  - Patient-Disjoint Rerun Checklist: patient_disjoint_rerun_todo.md
  - Windows AnyDesk Runner: windows_anydesk_runner.md
  - University Linux Runner: university_remote_runner.md
markdown_extensions:
  - admonition
  - tables
  - fenced_code

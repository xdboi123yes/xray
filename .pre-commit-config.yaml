# Pre-commit configuration for TCR-P chest X-ray research package

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.3.0
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: local
    hooks:
      - id: check-comment-language
        name: Check code comments and string literals are English-only
        entry: python scripts/check_comment_language.py
        language: system
        types_or: [python]

      - id: mypy-check
        name: Mypy Static Type Analysis
        entry: mypy src/tcrp/ scripts/generate_synthetics.py scripts/preprocess.py
        language: system
        pass_filenames: false
        always_run: true

      - id: import-linter
        name: Import Linter Boundaries
        entry: lint-imports
        language: system
        pass_filenames: false
        always_run: true

      - id: pytest-unit
        name: Pytest Unit Tests
        entry: pytest tests/unit -x --no-header -q
        language: system
        pass_filenames: false
        always_run: true

name: CI Quality Gate

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  research-ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements*.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
          pip install -e . --no-build-isolation --no-deps

      - name: Ruff check
        run: |
          ruff check src/tcrp/ tests/ scripts/

      - name: Mypy static check
        run: |
          mypy src/tcrp/

      - name: Import boundary check
        run: |
          lint-imports

      - name: Code comments and string literals language check
        run: |
          python scripts/check_comment_language.py

      - name: Run unit, integration, and E2E tests with coverage
        run: |
          pytest tests/ -v --cov=tcrp --cov-fail-under=72

      - name: Verify no raw print statements leak to production package
        run: |
          ! grep -rn "^\s*print(" src/tcrp/

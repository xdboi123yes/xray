# TCR-P Chest X-Ray Tiered Classification Research Package Configurations

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tcrp"
version = "1.0.0"
description = "TCR-P: Tiered Confidence-Routing System for Pneumothorax Chest Radiograph Screening"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
# E: Error, F: Pyflakes, I: Import sorting, N: Naming conventions,
# UP: Upgrade syntax, B: Bugbear, SIM: Simplification, RUF: Ruff custom
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]
ignore = ["E501", "N803", "B024", "B027", "N812", "B008", "RUF001", "UP038", "RUF003", "E701", "E741", "E402"]

[tool.mypy]
strict = true
disallow_untyped_calls = false
warn_return_any = false
mypy_path = "src"
files = ["src/tcrp"]
exclude = ["tests"]
warn_unused_ignores = false
follow_imports = "silent"

[[tool.mypy.overrides]]
module = [
    "torch",
    "torch.*",
    "torchvision.*",
    "timm.*",
    "diffusers.*",
    "albumentations.*",
    "codecarbon.*",
    "sklearn.*",
    "yaml",
    "pandas",
    "pytorch_fid.*",
    "tqdm.*",
    "pytorch_grad_cam.*",
    "scipy.*",
    "PIL.*",
    "structlog",
    "numpy",
    "numpy.*",
    "matplotlib",
    "matplotlib.*",
    "pydantic",
    "pydantic.*",
    "pydantic_settings",
    "cv2",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["mlflow", "mlflow.*"]
ignore_missing_imports = true
follow_imports = "skip"

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.importlinter]
root_packages = ["tcrp"]
include_external_packages = false

[[tool.importlinter.contracts]]
name = "Domain modules do not depend on training orchestration"
type = "forbidden"
source_modules = [
    "tcrp.config",
    "tcrp.routing",
    "tcrp.models",
    "tcrp.uncertainty",
    "tcrp.evaluation",
    "tcrp.data",
]
forbidden_modules = ["tcrp.training"]

[[tool.importlinter.contracts]]
name = "Routing and config stay leaf modules"
type = "forbidden"
source_modules = ["tcrp.config", "tcrp.routing"]
forbidden_modules = [
    "tcrp.data",
    "tcrp.models",
    "tcrp.uncertainty",
    "tcrp.evaluation",
    "tcrp.training",
]
